name: Latest blog posts

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://d-o0o-b11.github.io/feed.xml"
          max_post_count: 5
          commit_message: "최근 블로그 글 갱신"
